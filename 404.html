    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Librarte</title>
    <!-- Aplica el tema antes de que cargue React para evitar un destello del tema claro.
         Usa la misma clave que BotonTema -->
    <script>
      (function () {
        var tema = null
        try {
          tema = localStorage.getItem('librarte-tema')
        } catch (e) {}
        if (tema !== 'oscuro' && tema !== 'claro') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.setAttribute('data-tema', tema)
      })()
    </script>
